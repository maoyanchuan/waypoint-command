plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    def xaeroJar = file(project.findProperty('xaero_minimap_jar'))
    if (!xaeroJar.exists()) {
        throw new GradleException("Xaero's Minimap JAR not found: ${xaeroJar}. Set -Pxaero_minimap_jar=<path> or update xaero_minimap_jar in gradle.properties.")
    }
    compileOnly files(xaeroJar)
    testRuntimeOnly files(xaeroJar)

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def modVersion = version
processResources {
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

def projectName = base.archivesName.get()
jar {
    from('LICENSE') {
        rename { "${it}_${projectName}" }
    }
}

